# Builds an installable Android APK for testing and attaches it to a GitHub
# pre-release, so it can be downloaded straight onto a phone.
# Runs on every push to main, or by hand from the Actions tab.
name: Android test APK

on:
  push:
    branches: [main, claude/project-thread-if83et]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # Generates the native android/ project from app.json (it is not committed).
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # Release build, signed with the debug key: fine for sideloading, not for Play.
      # arm64-v8a only, which covers almost every phone from the last ~8 years.
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/hoziana-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: hoziana-apk
          path: out/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Android test build ${{ github.run_number }}
          prerelease: true
          body: |
            Test build from `${{ github.ref_name }}` at ${{ github.sha }}.
            On the phone: download the .apk below, open it, and allow "Install unknown apps" when asked.
          files: out/*.apk
