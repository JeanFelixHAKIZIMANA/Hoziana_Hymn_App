# Builds an installable Android APK for testing and attaches it to a GitHub
# pre-release, so it can be downloaded straight onto a phone.
# Runs on every push to main, or by hand from the Actions tab.
name: Android test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the release job below can write (to publish the APK).
permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Fail in seconds rather than after the long build. The secrets are only handed to the
      # steps that need them, never to npm install.
      - name: Check the signing key is set up
        env:
          HOZIANA_KEYSTORE_BASE64: ${{ secrets.HOZIANA_KEYSTORE_BASE64 }}
          HOZIANA_KEYSTORE_PASSWORD: ${{ secrets.HOZIANA_KEYSTORE_PASSWORD }}
          HOZIANA_KEY_ALIAS: ${{ secrets.HOZIANA_KEY_ALIAS }}
        run: |
          if [ -z "$HOZIANA_KEYSTORE_BASE64" ] || [ -z "$HOZIANA_KEYSTORE_PASSWORD" ] || [ -z "$HOZIANA_KEY_ALIAS" ]; then
            echo "::error::Add the HOZIANA_KEYSTORE_BASE64, HOZIANA_KEYSTORE_PASSWORD and HOZIANA_KEY_ALIAS repository secrets (see docs/android-signing.md)."
            exit 1
          fi

      - run: npm ci

      # Generates the native android/ project from app.json (it is not committed).
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # Signed with the Hoziana release key (an EC P-256 key) from the repository secrets;
      # see plugins/with-release-signing.js. arm64-v8a only, which covers almost every phone
      # from the last ~8 years.
      - name: Build APK
        working-directory: android
        env:
          HOZIANA_KEYSTORE_BASE64: ${{ secrets.HOZIANA_KEYSTORE_BASE64 }}
          HOZIANA_KEYSTORE_PASSWORD: ${{ secrets.HOZIANA_KEYSTORE_PASSWORD }}
          HOZIANA_KEY_ALIAS: ${{ secrets.HOZIANA_KEY_ALIAS }}
        run: |
          export HOZIANA_KEYSTORE_FILE="$RUNNER_TEMP/hoziana-release.p12"
          echo "$HOZIANA_KEYSTORE_BASE64" | base64 -d > "$HOZIANA_KEYSTORE_FILE"
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          rm -f "$HOZIANA_KEYSTORE_FILE"

      # Refuse to publish an APK signed with the shared debug key.
      - name: Check the APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk)
          echo "$CERT" | grep -E "Signer #1 certificate (DN|SHA-256)"
          if echo "$CERT" | grep -q "CN=Android Debug"; then
            echo "::error::The APK is signed with the debug key."
            exit 1
          fi

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/hoziana-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: hoziana-apk
          path: out/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: hoziana-apk
          path: out

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: android-test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Android test build ${{ github.run_number }}
          prerelease: true
          body: |
            Test build from `${{ github.ref_name }}` at ${{ github.sha }}.
            On the phone: download the .apk below, open it, and allow "Install unknown apps" when asked.
          files: out/*.apk
