# Security checks on every pull request and push to main (see SECURITY_AUDIT.md).
name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The app: Expo's command-line tools currently pull in an old zod with a High advisory that
      # only affects the dev server on your laptop (SECURITY_AUDIT.md L-7), so only Critical fails here.
      # Raise this to high once Expo ships the patched version.
      - name: App
        run: npm audit --audit-level=critical
      - name: Content website
        working-directory: admin
        run: npm audit --audit-level=high

  rls:
    name: Database rules (RLS tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Apply schema and migrations, then run the tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: supabase/tests/run-local.sh

  semgrep:
    name: Code scan (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      # The first run (2026-10-29) found nothing, so any new finding fails the check.
      - run: semgrep scan --error --config p/javascript --config p/typescript --config p/react --exclude src/data/hymns.json
